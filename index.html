<script>
const messagesEl = document.getElementById('messages');
const input = document.getElementById('inputMsg');
const sendBtn = document.getElementById('sendBtn');
let isTyping = false;
let userName = null;

const knowledgeBase = {
  saudacoes: ['olá','oi','hey','bom dia','boa tarde','boa noite','e aí','opa'],
  despedidas: ['tchau','adeus','até logo','até mais','até breve','falou','bye'],
  agradecimentos: ['obrigado','obrigada','valeu','thanks','agradeço'],
  curiosidades: [
    "O coração humano bombeia cerca de 7.200 litros de sangue por dia! 💓",
    "A luz do Sol leva 8 minutos para chegar à Terra. ☀️",
    "Um raio é cinco vezes mais quente que a superfície do Sol! ⚡",
    "As abelhas podem reconhecer rostos humanos! 🐝",
    "O polvo tem três corações e sangue azul! 🐙",
    "Bananas são ligeiramente radioativas devido ao potássio. 🍌",
    "O som não viaja no espaço porque não há ar. 🔇",
    "Elefantes são os únicos mamíferos que não conseguem pular. 🐘"
  ],
  piadas: [
    "Por que o livro de matemática ficou triste? Porque tinha muitos problemas! 📚😄",
    "O que o pato disse para a pata? Vem Quá! 🦆",
    "Qual é o contrário de volátil? Vem cá sobrinho! 😂",
    "Por que o café foi à polícia? Porque foi expresso! ☕",
    "O que é um pontinho amarelo no céu? Um Yellowcóptero! 🚁",
    "Por que a planta foi para o hospital? Porque ela não estava se sentindo bem! 🌱"
  ]
};

function addMessage(text, who='bot', showTime=true){
  const wrapper=document.createElement('div');
  wrapper.className='msg-wrapper '+who;
  const avatar=document.createElement('div');
  avatar.className='avatar '+(who==='me'?'user':'bot');
  avatar.textContent=who==='me'?'👤':'🤖';
  const msgContainer=document.createElement('div');
  const msg=document.createElement('div');
  msg.className='msg';
  msg.textContent=text;
  if(showTime){
    const time=document.createElement('div');
    time.className='timestamp';
    const now = new Date();
    const timeStr = now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    time.textContent = userName ? `${userName}, são ${timeStr}` : timeStr;
    msgContainer.appendChild(msg);
    msgContainer.appendChild(time);
  } else {msgContainer.appendChild(msg);}
  wrapper.appendChild(avatar);
  wrapper.appendChild(msgContainer);
  messagesEl.appendChild(wrapper);
  messagesEl.scrollTop=messagesEl.scrollHeight;
}

function showTyping(){
  const wrapper=document.createElement('div');
  wrapper.className='msg-wrapper bot';
  wrapper.id='typing-indicator';
  const avatar=document.createElement('div');
  avatar.className='avatar bot';
  avatar.textContent='🤖';
  const msg=document.createElement('div');
  msg.className='msg';
  const typing=document.createElement('div');
  typing.className='typing';
  typing.innerHTML='<span></span><span></span><span></span>';
  msg.appendChild(typing);
  wrapper.appendChild(avatar);
  wrapper.appendChild(msg);
  messagesEl.appendChild(wrapper);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function hideTyping(){
  const typingIndicator = document.getElementById('typing-indicator');
  if(typingIndicator) typingIndicator.remove();
}

function containsAny(text, keywords){
  return keywords.some(keyword=>text.includes(keyword));
}

function safeEval(expr){
  // Permite apenas números, espaços e operadores + - * / ( )
  if(!/^[0-9+\-*/().\s]+$/.test(expr)) return "❌ Expressão inválida!";
  try {
    const result = eval(expr);
    return `🧮 ${expr} = ${result}`;
  } catch(e){
    return "❌ Não consegui calcular essa expressão!";
  }
}

function botRespond(text){
  const t=text.toLowerCase().trim();

  if(!userName){
    userName = text.trim().split(' ')[0]; // pega o primeiro nome que usuário digitar
    return `Ótimo, ${userName}! Agora posso te ajudar melhor. 😊`;
  }

  if(containsAny(t,knowledgeBase.saudacoes)){
    const hora=new Date().getHours();
    if(hora<12) return `Bom dia, ${userName}! ☀️ Como posso ajudá-lo hoje?`;
    if(hora<18) return `Boa tarde, ${userName}! 😊 Em que posso ser útil?`;
    return `Boa noite, ${userName}! 🌙 Como posso auxiliá-lo?`;
  }

  if(containsAny(t,knowledgeBase.despedidas)) return `Até logo, ${userName}! Foi um prazer conversar com você. 👋😊`;
  if(containsAny(t,knowledgeBase.agradecimentos)) return `Por nada, ${userName}! Estou aqui para ajudar sempre que precisar. 😊`;
  if(t.includes('como você está')||t.includes('como vai')||t.includes('tudo bem')) return `Estou ótimo, obrigado por perguntar, ${userName}! 😊 E você?`;
  if(t.includes('seu nome')||t.includes('como se chama')||t.includes('quem é você')) return `Sou seu Assistente Virtual Profissional, ${userName}! 🤖`;
  if(t.includes('ajuda')||t.includes('ajudar')||t.includes('comandos')||t.includes('o que sabe')) return `Posso ajudar com: 🕐 Hora e data, 💡 Curiosidades, 😄 Piadas, 🧮 Cálculos simples, 📧 Informações de contato, 💬 Conversas gerais`;

  if(t.includes('hora')||t.includes('horário')){
    const now=new Date();
    const time=now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    return `🕐 ${userName}, são exatamente ${time} agora.`;
  }

  if(t.includes('data')||t.includes('hoje')||t.includes('dia')){
    const now=new Date();
    const date=now.toLocaleDateString('pt-BR',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
    return `📅 Hoje é ${date}, ${userName}.`;
  }

  if(t.includes('curiosidade')||t.includes('sabia que')||t.includes('me conte')){
    const random=knowledgeBase.curiosidades[Math.floor(Math.random()*knowledgeBase.curiosidades.length)];
    return `Você sabia, ${userName}? ${random}`;
  }

  if(t.includes('piada')||t.includes('engraçado')||t.includes('rir')){
    const random=knowledgeBase.piadas[Math.floor(Math.random()*knowledgeBase.piadas.length)];
    return random;
  }

  // Verifica se tem expressão matemática
  if(t.match(/[0-9+\-*/().\s]+/)){
    return safeEval(text);
  }

  const responses=[
    `Interessante, ${userName}! Pode me dar mais detalhes sobre isso? 🤔`,
    `Entendo, ${userName}. Como posso ajudar você com isso? 💬`,
    `Hmm, ${userName}, não tenho certeza sobre isso. Pode reformular sua pergunta? 🔍`,
    `Essa é uma questão interessante, ${userName}! Infelizmente não tenho essa informação no momento. 📚`,
    `Desculpe, ${userName}, ainda estou aprendendo sobre esse assunto. Pode tentar perguntar de outra forma? 🎓`
  ];
  return responses[Math.floor(Math.random()*responses.length)];
}

async function handleSend(){
  const text=input.value.trim();
  if(!text||isTyping) return;
  addMessage(text,'me');
  input.value='';
  sendBtn.disabled=true;
  isTyping=true;
  showTyping();
  await new Promise(resolve=>setTimeout(resolve,300+Math.random()*500));
  hideTyping();
  addMessage(botRespond(text),'bot');
  sendBtn.disabled=false;
  isTyping=false;
  input.focus();
}

sendBtn.addEventListener('click',handleSend);
input.addEventListener('keypress',(e)=>{if(e.key==='Enter'){handleSend();}});
function useSuggestion(text){input.value=text; input.focus(); handleSend();}

setTimeout(()=>{
  addMessage('Olá! Seja bem-vindo(a)! 👋','bot');
  setTimeout(()=>{addMessage('Qual é o seu nome? 😊','bot');},800);
},500);

input.focus();
    </script>
